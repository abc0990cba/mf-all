# Production deployment sample for one mf-all app (per app, one server block).
#
# The contract that makes independent deployment work:
#   /mf-manifest.json + /remoteEntry.js  → Cache-Control: no-cache (they are
#       the stable pointers other apps resolve at runtime; rollback = repoint)
#   /assets/*                            → hashed, immutable, cache forever
#   CORS                                  → other origins MUST be able to
#       fetch the manifest/entry/chunks (cross-origin federation)
#
# Deploy each app's dist/ to its own origin (mfvue.example.com, …) and point
# MF_ORIGIN_<APP> env vars of the other apps at those origins at build time.
# Keep the previous deploy's hashed chunks around for running sessions.

server {
  listen 80;
  server_name mfvue.example.com;

  root /srv/mf-all/vue/dist;
  index index.html;

  # --- CORS for federation consumers -------------------------------
  # The federation runtime fetches mf-manifest.json / remoteEntry.js and
  # hashed chunks cross-origin via dynamic import — every remote origin
  # must answer with CORS headers.
  location / {
    add_header Access-Control-Allow-Origin "*" always;

    # HTML shell: never cache
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # The deployment contract: always fresh
  location = /mf-manifest.json {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
  }

  location = /remoteEntry.js {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
  }

  # Hashed assets: immutable forever (keep old deploys' chunks!)
  location /assets/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # gzip for JS/CSS
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
