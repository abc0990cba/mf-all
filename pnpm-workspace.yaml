packages:
  - apps/*
  - packages/*
  - e2e

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# Single source of truth for versions shared across all 7 apps.
catalog:
  "@module-federation/vite": ^1.23.0
  vite: ^7.3.6
  typescript: ~5.9.3
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  nanostores: ^1.5.4
  concurrently: ^10.0.5

minimumReleaseAgeExclude:
  - '@angular/common@21.2.25 || 22.2.1'
  - '@angular/compiler-cli@21.2.25 || 22.2.1'
  - '@angular/compiler@21.2.25 || 22.2.1'
  - '@angular/core@21.2.25 || 22.2.1'
  - '@angular/platform-browser@21.2.25 || 22.2.1'
  - '@angular-devkit/architect@0.2202.1'
  - '@angular-devkit/core@22.2.1'
  - '@angular/build@22.2.1'
